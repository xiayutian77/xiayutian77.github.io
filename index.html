<head>
<meta charset="UTF-8">

<title>xiayutian77 的博客</title>
<style>
  :root { --accent:#2563eb; --bg:#f8fafc; --card:#fff; --text:#1e293b; --muted:#64748b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.7; }
  header { background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; padding:64px 20px; text-align:center; }
  header h1 { font-size:2.2rem; margin-bottom:8px; }
  header p { opacity:.85; }
  main { max-width:760px; margin:0 auto; padding:40px 20px; }
  .post { background:var(--card); border-radius:12px; padding:24px 28px; margin-bottom:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); transition:transform .15s, box-shadow .15s; }
  .post:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .post h2 a { color:var(--text); text-decoration:none; }
  .post h2 a:hover { color:var(--accent); }
  .post .meta { color:var(--muted); font-size:.85rem; margin:6px 0 10px; }
  .post p { color:#334155; }
  footer { text-align:center; color:var(--muted); padding:32px; font-size:.85rem; }
  footer a { color:var(--accent); text-decoration:none; }
  @media (max-width:600px){ header{padding:44px 16px;} header h1{font-size:1.6rem;} }
</style>
</head>
<body>
